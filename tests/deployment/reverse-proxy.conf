# Test reverse proxy ("deployment" job): terminates TLS in front of the docs/nginx/patrimeter-proxied.conf vhost and
# passes on what docs/installation.md (§ 8.1) requires from a proxy.
server {
    listen 443 ssl http2;
    server_name patrimeter.example.org;

    ssl_certificate     /etc/ssl/certs/patrimeter.example.org.pem;
    ssl_certificate_key /etc/ssl/private/patrimeter.example.org.key;

    location / {
        proxy_pass http://127.0.0.1:80;
        # To check the headers of the vhost under test, not those of this proxy.
        proxy_pass_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

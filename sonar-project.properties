# SonarQube analysis (job "sonarqube", docs/ci.md): the server and its token come from the CI variables
# SONAR_HOST_URL and SONAR_TOKEN, the version from the VERSION file (start of the "new code" of each release).
sonar.projectKey=patrimeter
sonar.projectName=Patrimeter
# The job fails when the quality gate is not passed.
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8

# Code of the application and of its tools; tests apart. Chart.js is a copied third-party file.
sonar.sources=src,assets,templates,migrations,public,bin,tools
sonar.tests=tests
sonar.exclusions=assets/vendor/**
sonar.test.exclusions=tests/Fixtures/**

# Coverage of the PHP by PHPUnit (job "coverage"). The browser JavaScript is covered by the Playwright flows, which
# give no line coverage: it is analysed, but left out of the coverage figure, as are migrations, templates and the
# entry points.
sonar.php.coverage.reportPaths=var/coverage/clover.xml
sonar.coverage.exclusions=assets/**,templates/**,migrations/**,public/**,bin/**
# Migrations restate their SQL on purpose (up and down): not counted as duplication.
sonar.cpd.exclusions=migrations/**

# Rules set aside where the W3C and WCAG ask for the opposite, each for a reason checked by the accessibility tests
# (axe-core, tests/e2e):
# - Web:S6845, tabindex on a non-interactive element: a scrollable area (table, budget flows) must be reachable from
#   the keyboard to be scrolled (WCAG 2.1.1, axe-core "scrollable-region-focusable");
# - Web:S6843, non-interactive role on an interactive element: role="img" with a description is the accessible form
#   of a Chart.js <canvas>, which "ARIA in HTML" allows (any role on canvas);
# - Web:S9379, autofocus: only on pages whose sole purpose is one form (sign-in, code, unlocking, registration,
#   password reset), on its first field, as the sign-in page does: one tap less on every visit.
sonar.issue.ignore.multicriteria=scroll,chart,focus
sonar.issue.ignore.multicriteria.scroll.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.scroll.resourceKey=templates/**/*.twig
sonar.issue.ignore.multicriteria.chart.ruleKey=Web:S6843
sonar.issue.ignore.multicriteria.chart.resourceKey=templates/**/*.twig
sonar.issue.ignore.multicriteria.focus.ruleKey=Web:S9379
sonar.issue.ignore.multicriteria.focus.resourceKey=templates/**/*.twig

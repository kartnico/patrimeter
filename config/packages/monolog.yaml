monolog:
    channels:
        - deprecation
        # CSP violation reports (CspReportController), separate log in production.
        - csp

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            # Only errors trigger the writing of the request's context; log in var/log, one file per day,
            # 14 days kept.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # mcp channel excluded: it quotes the tools' arguments, which are wealth data.
                channels: ['!deprecation', '!mcp', '!csp']
                buffer_size: 50
            # CSP violations reported by the browsers: var/log/csp-YYYY-MM-DD.log, 14 days.
            csp:
                type: rotating_file
                path: '%kernel.logs_dir%/csp.log'
                max_files: 14
                level: warning
                channels: [csp]
            nested:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                max_files: 14
                level: debug
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!mcp']
            # Critical error (500 page…): email to ADMIN_EMAIL, once per hour for the same message, without ever
            # making the request fail if the sending fails. Without SMTP, nothing is sent.
            alert:
                type: fingers_crossed
                action_level: critical
                handler: alert_deduplicated
                channels: ['!deprecation', '!mcp']
                buffer_size: 50
            alert_deduplicated:
                type: deduplication
                handler: alert_safe
                time: 3600
            alert_safe:
                type: whatfailuregroup
                members: [alert_mail]
            alert_mail:
                type: symfony_mailer
                from_email: '%env(MAIL_FROM)%'
                to_email: '%env(ADMIN_EMAIL)%'
                subject: 'Patrimeter : erreur critique'
                level: debug

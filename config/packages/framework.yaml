framework:
    secret: '%env(APP_SECRET)%'
    default_locale: fr
    # Interface languages: French (source language) and English.
    enabled_locales: [fr, en]
    http_method_override: false
    handle_all_throwables: true
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    csrf_protection: true

    # Sessions in var/sessions (only writable folder with the database): HttpOnly cookie,
    # SameSite=Strict, Secure as soon as the request arrives over HTTPS. The expiry after inactivity
    # is applied by Patrimeter\Security\SessionIdleTimeoutSubscriber.
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        name: '%env(SESSION_COOKIE_NAME)%'
        cookie_lifetime: 0
        cookie_path: /
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: strict
        gc_maxlifetime: 1800
        gc_probability: 1
        gc_divisor: 100

    php_errors:
        log: true

    # Expected refusals of the API: neither an error in the log nor a 500 status.
    exceptions:
        Patrimeter\Application\NotFound: { log_level: debug, status_code: 404 }
        Patrimeter\Application\ValidationFailed: { log_level: debug, status_code: 422 }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

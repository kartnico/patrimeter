# Patrimeter — vhost that terminates TLS itself, without a reverse proxy (docs/installation.md, § 8.2).
# To copy into /etc/nginx/sites-available/patrimeter.example.org.conf.
#
# Tested as is by the CI ("deployment" job).

server {
    listen 80;
    listen [::]:80;
    server_name patrimeter.example.org;
    server_tokens off;

    return 301 https://patrimeter.example.org$request_uri;
}

server {
    # "http2" as a parameter of listen: understood by every nginx version still in use ("http2 on" only exists from
    # 1.25, which reports the old form as deprecated without refusing it).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name patrimeter.example.org;

    ssl_certificate     /etc/ssl/certs/patrimeter.example.org.pem;
    ssl_certificate_key /etc/ssl/private/patrimeter.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/patrimeter-app.conf;
}

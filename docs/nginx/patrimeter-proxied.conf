# Patrimeter — vhost behind a reverse proxy that terminates TLS (docs/installation.md, § 8.1).
# To copy into /etc/nginx/sites-available/patrimeter.example.org.conf.
#
# The proxy must pass Host, X-Forwarded-Proto and X-Forwarded-For, and its address must be in TRUSTED_PROXIES
# (.env.local). Tested as is by the CI ("deployment" job).

server {
    listen 80;
    listen [::]:80;
    server_name patrimeter.example.org;

    include snippets/patrimeter-app.conf;
}

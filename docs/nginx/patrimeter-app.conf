# Patrimeter — common part of both vhosts (docs/installation.md, § 8).
# To copy into /etc/nginx/snippets/patrimeter-app.conf.

root /srv/patrimeter/public;

server_tokens off;
charset utf-8;
client_max_body_size 64k;

access_log /var/log/nginx/patrimeter.example.org.access.log;
error_log  /var/log/nginx/patrimeter.example.org.error.log;

# Access restricted to the local network (adapt to the ranges really used). Behind a reverse proxy, nginx sees the
# proxy: its address must be listed here.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow fc00::/7;
deny all;

# OAuth metadata (RFC 8414, RFC 9728), served by the application: the only exception to the hidden files.
location ^~ /.well-known/oauth- {
    try_files /index-absent /index.php$is_args$args;
}

# Hidden files (.git, .env…): never served.
location ~ /\. {
    return 404;
}

# CSS and JS compiled by "bin/console asset-map:compile": their name contains a hash of the content, so they can be
# cached forever.
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location = /favicon.svg { try_files $uri =404; add_header X-Content-Type-Options "nosniff" always; }
location = /robots.txt  { try_files $uri =404; }

# Data import (JSON and CSV, docs/export.md), import of a member's file into a family account and bank statement of an
# account: the only requests of more than 64 KB accepted, 2 MB at most.
location ~ "^/donnees/import(-csv)?$" {
    client_max_body_size 2m;
    fastcgi_pass unix:/run/php/patrimeter.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}

# Bank statement read on an account page (OFX, CAMT.053), 2 MB at most too.
location ~ "^/comptes/[0-9]{1,9}/releves/fichier$" {
    client_max_body_size 2m;
    fastcgi_pass unix:/run/php/patrimeter.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}

location ~ "^/famille/membres(/[0-9]{1,9})?$" {
    client_max_body_size 2m;
    fastcgi_pass unix:/run/php/patrimeter.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}

# Known addresses only (allowlist): the routes of the application reach its front controller, which adds the
# security headers (CSP, HSTS…); any other address gets a 404 from nginx, without running PHP. The site only needs
# GET, HEAD and POST; the REST API and the MCP service also PUT, DELETE and OPTIONS. NginxConfigTest checks that
# every route of the application is covered.
location = / {
    limit_except GET HEAD POST { deny all; }
    try_files $uri /index.php$is_args$args;
}

# Sign-in forms and the installation wizard: also limited per address (patrimeter-limits.conf).
location ~ ^/(connexion|inscription|installation|mot-de-passe-oublie|deverrouiller|demo)(/|$) {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=patrimeter_forms burst=30 nodelay;
    try_files $uri /index.php$is_args$args;
}

location ~ ^/(saisie|budget|comptes|biens|objectifs|indicateurs|defis|bienvenue|rappel|historique|rapport|securite|donnees|famille|deconnexion|theme|langue|csp|sante|oauth)(/|$) {
    limit_except GET HEAD POST { deny all; }
    try_files $uri /index.php$is_args$args;
}

location ~ ^/(api|mcp)(/|$) {
    try_files $uri /index.php$is_args$args;
}

# Anything else: unknown address.
location / {
    return 404;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass unix:/run/php/patrimeter.sock;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    # Only reachable through try_files: "/index.php" typed in the address returns 404.
    internal;
}

# No other PHP script can run.
location ~ \.php$ {
    return 404;
}

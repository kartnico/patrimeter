# Messages de validation propres à Patrimeter (contraintes du Validator). Les messages de Symfony sont traduits par le composant.
"Le mot de passe doit faire au moins {{ limit }} caractères.": "The password must be at least {{ limit }} characters long."
"Le mot de passe est trop long.": "The password is too long."
"Le mot de passe ne doit pas contenir votre adresse e-mail.": "The password must not contain your email address."
"Mot de passe trop prévisible : allongez-le (une phrase de plusieurs mots convient très bien).": "Password too predictable: make it longer (a phrase of several words works very well)."
"Ce mot de passe figure dans des fuites de données connues : choisissez-en un autre.": "This password appears in known data breaches: choose another one."
"Date invalide.": "Invalid date."
"Choisissez un type de compte.": "Choose an account type."
"Choisissez un niveau de pyramide.": "Choose a pyramid level."
"Choisissez actif ou passif.": "Choose asset or liability."
"Date d'ouverture invalide (AAAA-MM-JJ).": "Invalid opening date (YYYY-MM-DD)."
"Date de clôture invalide (elle doit suivre la date d'ouverture).": "Invalid closing date (it must be after the opening date)."
"Indiquez un nom de 1 à 80 caractères.": "Enter a name of 1 to 80 characters."
"Montant trop grand.": "Amount too large."
"Montant en centimes attendu.": "Amount in cents expected."
"Choisissez un bien, pour un crédit.": "Choose a property, for a loan."
"Mode : prorata ou own.": "Mode: prorata or own."
"Part en millionièmes attendue, de 1 à 1 000 000.": "Share in millionths expected, from 1 to 1,000,000."
"Donnez un nom au bien (80 caractères au plus).": "Give the property a name (80 characters at most)."
"Donnez un nom au crédit (80 caractères au plus).": "Give the loan a name (80 characters at most)."
"Le montant ne peut pas être négatif.": "The amount cannot be negative."
"Part invalide : un pourcentage supérieur à 0 et au plus 100.": "Invalid share: a percentage above 0 and at most 100."
"Montant vide.": "Empty amount."
"Montant invalide.": "Invalid amount."
"Montant invalide (2 décimales maximum).": "Invalid amount (2 decimal places at most)."

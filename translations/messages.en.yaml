"Avez-vous un compte courant ? Environ combien dessus aujourd'hui ?": "Do you have a current account? About how much is on it today?"
"Le compte courant compte dans l'épargne de précaution : l'argent disponible tout de suite.": "The current account counts in the emergency savings: the money available right away."
"Avez-vous de l'argent de côté, disponible tout de suite (Livret A, LDDS, LEP…) ?": "Do you have money put aside, available right away (Livret A, LDDS, LEP…)?"
"Les livrets forment l'épargne de précaution : de l'argent disponible tout de suite, sans risque de perte.": "Savings accounts make up the emergency savings: money available right away, without any risk of loss."
"Avez-vous une assurance vie en fonds euros ?": "Do you have a life insurance in a euro fund?"
"Le fonds euros d'une assurance vie a son propre niveau dans la pyramide : un capital garanti, disponible en quelques jours.": "The euro fund of a life insurance has its own level in the pyramid: a guaranteed capital, available within a few days."
"Avez-vous des placements en bourse (actions, PEA, compte-titres, unités de compte) ?": "Do you have stock market investments (shares, PEA, securities account, unit-linked funds)?"
"Les placements en bourse forment le niveau des actions : leur valeur monte et descend avec les marchés.": "Stock market investments make up the equities level: their value goes up and down with the markets."
"Êtes-vous propriétaire de votre logement ? Combien vaut-il environ ?": "Do you own your home? About how much is it worth?"
"La résidence principale est un niveau à part de la pyramide. Détenue à plusieurs ? Vous indiquerez votre part ensuite, dans Biens immobiliers.": "The main residence is a level of its own in the pyramid. Owned with others? You will give your share afterwards, in Real estate."
"Reste-t-il un crédit sur ce logement ? Environ combien à rembourser ?": "Is there still a loan on this home? About how much is left to repay?"
"Le capital restant dû est déduit de la valeur du logement, au même niveau de la pyramide.": "The outstanding principal is deducted from the value of the home, at the same level of the pyramid."
"Avez-vous un autre crédit en cours (voiture, travaux, consommation) ? Environ combien reste-t-il à rembourser ?": "Do you have another loan running (car, works, consumer loan)? About how much is left to repay?"

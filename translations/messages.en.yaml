"Découvrir Patrimeter": "Discover Patrimeter"
"Essayez-le dans un compte de démonstration, sans inscription : des données fictives, supprimées au bout de %minutes% minutes ou à la déconnexion. N'y saisissez aucune donnée réelle.": "Try it in a demo account, without registering: fictitious data, deleted after %minutes% minutes or when you sign out. Do not enter any real data in it."
"Essayer la démo": "Try the demo"
"Démonstration": "Demo"
"Données fictives, compte supprimé à %time% ou à la déconnexion. N'y saisissez aucune donnée réelle.": "Fictitious data, account deleted at %time% or when you sign out. Do not enter any real data in it."
"Votre patrimoine net": "Your net worth"
"Tout ce que le foyer possède, moins ce qu'il doit encore, pour le mois affiché ; son évolution sur un mois et sur un an. Les flèches et le calendrier changent de mois.": "Everything the household owns, minus what it still owes, for the month shown; its change over one month and over one year. The arrows and the calendar change the month."
"La pyramide": "The pyramid"
"Chaque étage est un niveau de placement, du plus sûr au plus risqué : la résidence principale à la base, puis l'épargne de précaution, les fonds euros, les actions et l'immobilier, l'exotique au sommet. Une base large avant de monter.": "Each floor is a level of investment, from the safest to the riskiest: the main residence at the base, then emergency savings, guaranteed funds, stocks and real estate, the exotic at the top. A wide base before climbing."
"Le détail par niveau": "The detail by level"
"Chaque niveau se déplie sur ses comptes. Un solde « reporté » est le dernier connu : il compte jusqu'à la saisie du mois.": "Each level expands to its accounts. A \"carried over\" balance is the last one known: it counts until the month is entered."
"L'historique": "The history"
"L'évolution du patrimoine net, en graphique et mois par mois, sur la période de votre choix.": "How the net worth changed, as a chart and month by month, over the period of your choice."
"La saisie du mois": "The monthly entry"
"Une fois par mois, le solde de chaque compte en un seul formulaire, classé par niveau. Les totaux se recalculent pendant la frappe ; on peut aussi reprendre les soldes d'un autre mois.": "Once a month, the balance of each account in a single form, sorted by level. The totals are recalculated as you type; you can also copy the balances of another month."
"Les comptes et crédits": "The accounts and loans"
"Livrets, assurance-vie, PEA, crédits… 38 types prédéfinis, rangés dans leur niveau. Un compte fermé s'archive et garde son historique.": "Savings accounts, life insurance, stock accounts, loans… 38 predefined types, sorted into their level. A closed account is archived and keeps its history."
"Les biens immobiliers": "The properties"
"Un bien et ses crédits : valeur, capital restant dû et valeur nette. Ici, la résidence principale est détenue à moitié, et le crédit compte au prorata.": "A property and its loans: value, outstanding capital and net value. Here, the main residence is held at half, and the loan counts pro rata."
"Le budget du foyer": "The household budget"
"Les revenus de chaque adulte, le budget commun et ce qui reste à chacun ; le budget se saisit chaque mois, comme les soldes.": "Each adult's income, the shared budget and what is left to each; the budget is entered every month, like the balances."
"Les flux et la règle 50/30/20": "The flows and the 50/30/20 rule"
"Où vont les revenus : besoins, envies et épargne, comparés à la règle 50/30/20.": "Where the income goes: needs, wants and savings, compared with the 50/30/20 rule."
"Le détail des budgets": "The detail of the budgets"
"Le budget commun et celui de chaque adulte se déplient sur leurs catégories et leurs postes : touchez la flèche.": "The shared budget and each adult's budget expand to their categories and items: tap the arrow."
"Le rapport à partager": "The report to share"
"Le patrimoine du mois sur une carte, avec ou sans les montants, à garder en image ou à partager.": "The month's net worth on a card, with or without the amounts, to keep as a picture or to share."
"À vous de jouer": "Your turn"
"Modifiez les soldes, ajoutez un compte, changez le budget : tout sera supprimé à la fin de la démonstration. La visite se relance depuis le bandeau du haut.": "Change the balances, add an account, edit the budget: everything will be deleted at the end of the demo. The tour can be started again from the banner at the top."
